# The AI connector's coverage check: does every feature of the site have a tool that answers
# it, or a reason it is left out? (tools/savant-mcp/coverage.mjs, coverage.json)
#
# Runs whenever the site's pages, data list, routes or endpoints change on main, and once a
# week. It reads file names and source text only, so it takes seconds. When the site has grown
# past the connector, it opens (or refreshes) an issue labelled "connector-coverage" listing
# what is missing; the weekly scheduled Claude run reads the same check, builds the tools and
# opens a pull request for Adam to approve. When everything is covered again, the issue closes.
name: Connector coverage

on:
  push:
    branches: [main]
    paths:
      - 'public/*.html'
      - 'public/*.js'
      - 'public/*.json'
      - 'src/App.jsx'
      - 'api/**'
      - 'tools/savant-mcp/coverage.*'
  schedule:
    - cron: '23 12 * * 0'   # Sundays, 8:23am EDT
  workflow_dispatch:

concurrency:
  group: connector-coverage
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Check coverage
        id: check
        run: |
          set +e
          node --test tools/savant-mcp/coverage.mjs > coverage.log 2>&1
          code=$?
          cat coverage.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or refresh the issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create connector-coverage --color C2A263 --description "The AI connector does not cover something on the site" 2>/dev/null || true
          body=$(printf 'The coverage check found parts of wcehoops.com the AI connector does not answer yet.\n\nThe weekly scheduled run builds the missing tools and opens a pull request for approval. To do it now, ask Claude to run it.\n\n```\n%s\n```\n' "$(grep -vE '^\s+at |node:internal|^TAP|^# (tests|suites|pass|fail|cancelled|skipped|todo|duration)' coverage.log | head -80)")
          n=$(gh issue list --label connector-coverage --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "AI connector: new site features to cover" --label connector-coverage --body "$body"; fi
          exit 1
      - name: Close the issue when covered
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label connector-coverage --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Every feature of the site is covered again."
          done
