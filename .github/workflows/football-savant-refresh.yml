# Football Savant — refresh the season in progress.
#
# Rebuilds only the current season from nflverse and commits the small result
# (public/football-savant-current.json, that season's field map and its week-by-week
# game lines in public/football-weekly/) to main, which Vercel
# deploys. The 1999–2025 archive is never touched here; see pipeline/football/README.md.
#
# Schedule, in UTC (nflverse's feeds settle overnight, NGS by ~5am ET):
#   11:11 every day           7:11am EDT / 6:11am EST — the everyday morning refresh
#   04:41 Fri, Mon, Tue       ~12:41am ET after Thursday, Sunday and Monday night games
#
# The odd minutes are deliberate. GitHub queues scheduled workflows, and :00 and :30 are
# where everybody's crons pile up: through the first two weeks of the 2026 season every
# run of this job landed three and a half to five hours after its slot, so the "8am"
# refresh was reaching the site at half past twelve. An off-peak minute is the one lever
# a repository has.
# Run it by hand from the Actions tab (workflow_dispatch) any time.
name: Football Savant refresh

on:
  schedule:
    - cron: '11 11 * * *'
    - cron: '41 4 * * 1,2,5'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to rebuild (blank = current)'
        required: false
        default: ''

concurrency:
  group: football-savant-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandas + pyarrow (+ pyreadr for the fourth-down model)
        run: pip install --quiet pandas pyarrow pyreadr

      - name: Rebuild the current season
        working-directory: pipeline/football
        run: ./refresh_current.sh ${{ github.event.inputs.season }}

      # Coaching Savant rides on the same downloads. It rebuilds only the season in progress
      # and writes the small overlay the page lays over the archive; the archive itself
      # (public/coaching-savant-data.json) is only rebuilt by the full-rebuild workflow.
      # A failure here must not stop Football Savant's refresh from landing.
      - name: Coaching Savant — the season in progress
        working-directory: pipeline/football
        continue-on-error: true
        run: |
          Y=${{ github.event.inputs.season }}
          if [ -z "$Y" ]; then Y=$(date +%Y); [ "$(date +%m)" -ge 8 ] || Y=$((Y-1)); fi
          NFL_SEASONS="$Y" COACH_BASE="$GITHUB_WORKSPACE/public/coaching-savant-data.json" \
          COACH_OUT="$RUNNER_TEMP/coaching-full.json" \
          COACH_CURRENT="$GITHUB_WORKSPACE/public/coaching-savant-current.json" \
          NFL_RAW=raw python3 coaches.py

      - name: Commit if anything changed
        run: |
          git config user.name "football-savant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/football-savant-current.json public/football-maps/ public/football-weekly/ public/football-routes/
          [ -f public/coaching-savant-current.json ] && git add public/coaching-savant-current.json
          if git diff --cached --quiet; then
            echo "no data change — nothing to commit"
            exit 0
          fi
          SEASON=$(python3 -c "import json;j=json.load(open('public/football-savant-current.json'));print(j['seasons'][0])")
          WEEK=$(python3 -c "import json;j=json.load(open('public/football-savant-current.json'));print(j['data'][j['seasons'][0]].get('week','final'))")
          git commit -m "Football Savant: refresh $SEASON (week $WEEK)"
          # someone may have pushed while this ran; the data files are ours alone, so a
          # rebase never conflicts on them
          git pull --rebase origin main
          git push origin HEAD:main
