# College Basketball Savant — the season in progress, refreshed in the cloud after every slate.
#
# Same shape as basketball-savant-cloud.yml. College game days run from about noon to 3am ET with
# heavy Saturdays, so a slate watcher (pipeline/college/cloud_run.sh watch) starts at 16:47 UTC and
# stays up, checking every 5 minutes, until every one of that day's games is final, settled and
# published; after 5 hours it hands over to a fresh watcher. GitHub runs frequent schedules only when
# it has spare capacity, so three backups cover a dropped start. Odd minutes on purpose.
#
# Dry run: `mode=dry` does a whole refresh and commits nothing. A push to this branch, before the
# workflow is on main, runs that same dry run, which is how the build proved it on a runner.
#
# T-Rank refuses GitHub's runners, so the Mac sends this season's ages (pipeline/college/mac_pull.sh).
#
# The first of each month it uploads the month's raw ESPN bundle (rung 0).
name: College Basketball Savant cloud refresh

on:
  schedule:
    - cron: '47 16 * * *'     # watcher
    - cron: '23 22 * * *'     # watcher, backup
    - cron: '19 1 * * *'      # watcher, backup
    - cron: '37 3 * * *'      # watcher, backup (late West Coast tips)
    - cron: '29 10 * * *'     # rebuild regardless, for stat corrections
    - cron: '53 11 1 * *'     # the month's raw archive
  push:
    branches: [college-basketball-savant]
    paths: ['.github/workflows/college-basketball-savant-cloud.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'once, watch, dry (a full refresh that commits nothing) or archive'
        type: choice
        options: [once, watch, dry, archive]
        default: once

concurrency:
  group: college-basketball-savant-cloud
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Control Room check-in (start)
        continue-on-error: true
        timeout-minutes: 1
        run: bash .github/scripts/control-room.sh college-savant start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/college/requirements-cloud.txt
      # The season's raw finals, cached between runs. The current season can also be pulled whole
      # in about two minutes, so a lost cache costs nothing.
      - uses: actions/cache@v4
        with:
          path: |
            .espn-cbb-cache
            .cbb-home
          key: espn-cbb-${{ github.run_id }}
          restore-keys: espn-cbb-
      - name: Install
        run: pip install --quiet -r pipeline/college/requirements-cloud.txt
      - name: Refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EV="${{ github.event_name }}"; CRON="${{ github.event.schedule }}"; MODE="${{ github.event.inputs.mode }}"
          if [ "$EV" = "push" ] || [ "$MODE" = "dry" ]; then exec bash pipeline/college/cloud_run.sh dry
          elif [ "$CRON" = "53 11 1 * *" ] || [ "$MODE" = "archive" ]; then
            M=$(date -u -d 'yesterday' +%Y-%m)
            cd pipeline/college && python3 -c "import config,espn_cbb as E;E.pull_summaries(config.CURRENT,E.sweep(config.CURRENT))" \
              && python3 archive.py pack "$M" && python3 archive.py verify "$M" && python3 archive.py release "$M"
          elif [ "$CRON" = "29 10 * * *" ]; then exec bash pipeline/college/cloud_run.sh once --force
          elif [ "$MODE" = "once" ]; then exec bash pipeline/college/cloud_run.sh once --force
          else exec bash pipeline/college/cloud_run.sh watch 5
          fi
      - name: Control Room check-in
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WCE_NTFY_TOPIC: ${{ secrets.WCE_NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/control-room.sh college-savant "${{ job.status }}"
