name: Basketball Savant freshness

# The Basketball Savant refresh runs in the cloud (basketball-savant-cloud.yml: after every
# slate, plus 5:41am and 11:13am ET regardless) and writes a heartbeat, data/savant-refresh.json.
# This job is the alarm: once a day it reads the heartbeat and fails (GitHub emails the failure)
# when no refresh has landed for 30 hours, i.e. both daily runs and every slate check missed,
# so a broken refresh doesn't go unnoticed. A second step fails when the connector's Data Rooms
# (Basketball Coaching Savant's nba_coaching_data, College Basketball Savant's cbb_data) lag
# Basketball Savant's newest game: tools/savant-mcp/freshness.mjs, against the live site.
#
# The heartbeat is written even on days with no games, so the All-Star break doesn't trip it.
# Quiet outside the regular season, and in the first week before any refresh has landed.
on:
  schedule:
    - cron: '7 16 * * *'      # 12:07 ET (11:07 in winter), after both daily runs
  workflow_dispatch:

permissions:
  id-token: write   # Control Room check-ins prove they come from this repo (no secret needed)
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/savant-refresh.json
            .github/scripts/control-room.sh
            tools/savant-mcp/freshness.mjs
          sparse-checkout-cone-mode: false
      - name: Control Room check-in (start)
        continue-on-error: true
        timeout-minutes: 1
        run: bash .github/scripts/control-room.sh basketball-freshness start

      - name: Check the refresh has landed
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, sys
          today = dt.date.today()
          # Regular season: Oct 20 to mid April.
          in_season = (today.month == 10 and today.day >= 20) or today.month in (11, 12, 1, 2, 3) or (today.month == 4 and today.day <= 15)
          if not in_season:
              print("offseason; nothing to check"); sys.exit(0)
          path = "data/savant-refresh.json"
          if not os.path.exists(path):
              if today.month == 10 and today.day <= 27:
                  print("no refresh yet; first week of the season"); sys.exit(0)
              print(f"::error::{path} is missing: the nightly Basketball Savant refresh has not published this season. See the Basketball Savant cloud refresh runs in the Actions tab")
              sys.exit(1)
          beat = json.load(open(path))
          last = dt.datetime.fromisoformat(beat["last_ok"])
          age = (dt.datetime.now(dt.timezone.utc) - last).total_seconds() / 3600
          print(f"last check-in {last:%Y-%m-%d %H:%M} UTC ({age:.0f}h ago); {beat.get('season')} through {beat.get('through')}")
          if age > 30:
              print(f"::error::The Basketball Savant refresh last ran {age:.0f} hours ago. See the Basketball Savant cloud refresh runs in the Actions tab")
              sys.exit(1)
          EOF

      # The connector's Data Rooms against Basketball Savant's newest game, read from the live
      # site (what an assistant actually gets): Basketball Coaching Savant's five tables within a
      # day, College Basketball Savant's games table within three. Nov 2026: the coaching refresh
      # said rc=0 on every pass while nba_coaching_data sat at Oct 31; this would have caught it
      # the next morning. Same check locally: npm run check:freshness.
      - name: Check the Data Rooms are as fresh as Basketball Savant
        run: |
          rc=0
          python3 - <<'EOF' || rc=$?
          import datetime as dt, sys
          today = dt.date.today()
          in_season = (today.month == 10 and today.day >= 27) or today.month in (11, 12, 1, 2, 3) or (today.month == 4 and today.day <= 15)
          sys.exit(0 if in_season else 3)
          EOF
          if [ $rc -eq 3 ]; then echo "offseason; nothing to check"; exit 0; fi
          node tools/savant-mcp/freshness.mjs --site https://wcehoops.com --days 1 --cbb-days 3

      # Tells the WCE Control Room (/wce) how the run went; a failure pushes to Adam's phone.
      - name: Control Room check-in
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WCE_NTFY_TOPIC: ${{ secrets.WCE_NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/control-room.sh basketball-freshness "${{ job.status }}"
