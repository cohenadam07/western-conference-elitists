# Football Savant — rebuild the whole archive, on demand.
#
# The daily job (football-savant-refresh.yml) rebuilds only the season in progress, into
# public/football-savant-current.json. The 1999–last-season archive in
# public/football-savant-data.json is a separate, much bigger build, and until now it was
# a local run on one laptop — which meant that adding a metric to the pipeline reached
# 2026 the next morning and the other twenty-seven seasons whenever somebody found an
# afternoon. This does that run here instead: Actions → Football Savant full rebuild →
# Run workflow.
#
# It is deliberately manual. It downloads about 750 MB from nflverse, takes the better
# part of an hour, and commits a 43 MB file, so it should happen when a metric changes,
# not on a timer.
name: Football Savant full rebuild

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to build — blank for 1999 to now, or e.g. 2022-2026'
        required: false
        default: ''

concurrency:
  group: football-savant-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NFL_SEASONS: ${{ github.event.inputs.seasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandas + pyarrow (+ pyreadr for the fourth-down model)
        run: pip install --quiet pandas pyarrow pyreadr

      # The career awards (Pro Bowls, All-Pro, Hall of Fame, MVP and the rest) live in a
      # pipeline artifact that is not in the repository, and a rebuild without it would
      # quietly strip every award off every career page. So: lift the ones already in the
      # shipped archive first, then try to refresh them, and keep the old set if the
      # refresh fails. Losing them is not an acceptable outcome of a rebuild.
      - name: Carry the career awards forward
        working-directory: pipeline/football
        run: |
          mkdir -p agg
          python3 - <<'PY'
          import json, os
          src = '../../public/football-savant-data.json'
          if not os.path.exists(src):
              print('no shipped archive to lift awards from'); raise SystemExit(0)
          j = json.load(open(src))
          aw = j.get('awards') or {}
          if aw:
              json.dump(aw, open('agg/awards.json', 'w'), separators=(',', ':'))
          print('carried forward awards for %d players' % len(aw))
          PY

      - name: Refresh the career awards (best effort)
        working-directory: pipeline/football
        continue-on-error: true
        run: |
          NFL_AGG=agg_awards python3 awards.py
          if [ -s agg_awards/awards.json ]; then
            python3 -c "import json,sys; d=json.load(open('agg_awards/awards.json')); sys.exit(0 if len(d)>500 else 1)" \
              && cp agg_awards/awards.json agg/awards.json && echo "awards refreshed"
          fi

      - name: Fetch every nflverse source
        working-directory: pipeline/football
        run: ./fetch.sh

      # Every aggregate stage refresh_current.sh runs, in the same order. Leaving one out
      # does not fail the build - build.py treats a missing aggregate as a season that
      # simply has no data for it - so the first rebuild rebuilt all twenty-eight seasons
      # with every lineman still in one undifferentiated pool, and looked like a success.
      - name: Aggregate play-by-play, charting, line spots and participation
        working-directory: pipeline/football
        run: |
          python3 pbp_agg.py
          python3 ftn_agg.py
          python3 line_agg.py
          python3 onfield_agg.py
          python3 roles_agg.py
          NFL_ROUTES="$GITHUB_WORKSPACE/public/football-routes" python3 route_agg.py

      - name: Field maps
        working-directory: pipeline/football
        run: NFL_MAPS="$GITHUB_WORKSPACE/public/football-maps" python3 maps.py

      - name: Build the archive
        working-directory: pipeline/football
        run: NFL_OUT="$GITHUB_WORKSPACE/public/football-savant-data.json" python3 build.py

      # The Weekly chart reads game lines for the season on screen, whichever it is, and
      # they are worked out by build.py's own build_player(). So when a metric changes, every
      # season's game lines have to be redone with it, or the archive's weekly charts would
      # be missing the new row. About ten minutes for all of them; files are rewritten only
      # when their contents change. NFL_ARCHIVE is the archive the step above just wrote:
      # the season in progress takes last season's pass-snap corrections from it, the same
      # ones its card was built with, so a game line and the card it belongs to agree.
      - name: Week-by-week game lines
        working-directory: pipeline/football
        run: |
          NFL_ARCHIVE="$GITHUB_WORKSPACE/public/football-savant-data.json" \
          NFL_WEEKLY="$GITHUB_WORKSPACE/public/football-weekly" python3 weekly.py

      # Splits are one file a season, straight from the play-by-play. The same-point
      # baselines are every finished season rebuilt as it stood after each week, from the
      # same inputs the step above used; they need all of those seasons' files on disk, so
      # a rebuild of a few seasons leaves them as they are (pace.py says so and stops).
      - name: Situational splits and same-point baselines
        working-directory: pipeline/football
        run: |
          NFL_SPLITS="$GITHUB_WORKSPACE/public/football-splits" python3 splits.py
          NFL_ARCHIVE="$GITHUB_WORKSPACE/public/football-savant-data.json" \
          NFL_WEEKLY="$GITHUB_WORKSPACE/public/football-weekly" \
          NFL_PACE="$GITHUB_WORKSPACE/public/football-pace" python3 pace.py

      # Coaching Savant's archive: records from the whole schedule, style from every season,
      # fourth downs from 2014 and play-caller units from 2018. With a season list the
      # other seasons are carried over from the shipped archive rather than dropped.
      - name: Build the Coaching Savant archive
        working-directory: pipeline/football
        run: |
          COACH_BASE="$GITHUB_WORKSPACE/public/coaching-savant-data.json" \
          COACH_OUT="$RUNNER_TEMP/coaching-savant-data.json" python3 coaches.py
          cp "$RUNNER_TEMP/coaching-savant-data.json" "$GITHUB_WORKSPACE/public/coaching-savant-data.json"

      - name: Commit if anything changed
        run: |
          git config user.name "football-savant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/football-savant-data.json public/football-maps/ public/football-routes/ public/football-weekly/ public/football-splits/ public/football-pace/ public/coaching-savant-data.json
          if git diff --cached --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          SPAN=$(python3 -c "import json;j=json.load(open('public/football-savant-data.json'));print(j['seasons'][-1]+'-'+j['seasons'][0])")
          git commit -m "Football Savant: full archive rebuild ($SPAN)"
          git pull --rebase origin main
          git push origin HEAD:main
