<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B1626">
  <title>WCE Control Room</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <!--
    WCE Control Room: a private live map of everything behind wcehoops.com.
    Code: tools/control-room/ (page.ts, draw.ts), built into public/control/ by build.sh.
    Data: /api/status, read with the feed's key (asked for once, kept in this browser).
  -->
  <style>
    :root {
      --bg: #0B1626; --panel: #12233A; --line: #284263; --gold: #C2A263; --gold-soft: #8C7748;
      --cream: #ECEBE8; --dim: #8B9BB2; --faint: #5C6E86; --red: #F0583F; --amber: #E8A33A;
      --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--sans); }
    body { min-height: 100vh; }
    a { color: var(--gold); }
    button { font: inherit; color: inherit; cursor: pointer; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--gold); padding-bottom: 12px; }
    .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
    h1 { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 500; font-size: 30px; margin: 0; }
    #summary { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--dim); }
    nav { display: flex; gap: 8px; align-items: center; margin: 16px 0 12px; flex-wrap: wrap; }
    nav button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 14px; }
    nav button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
    nav .spacer { flex: 1; }
    nav .ghost { background: none; border: none; color: var(--faint); font-size: 12px; padding: 6px 8px; }
    #problem { background: #2A1F10; border: 1px solid var(--amber); color: var(--amber); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .stage.drawing { overflow-x: auto; border-radius: 14px; }
    .stage.drawing svg { display: block; width: 100%; min-width: 760px; height: auto; }
    .stage .node { cursor: pointer; }
    .stage .node:hover rect { stroke: var(--gold); }
    #chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; display: inline-flex; align-items: center; }
    .chip.on { border-color: var(--gold); }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; flex: none; }
    .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--gold)); border-radius: 12px; padding: 16px 18px; margin-top: 8px; }
    .card h2 { font-size: 18px; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .card p { margin: 6px 0; font-size: 14px; line-height: 1.45; }
    .muted { color: var(--dim); }
    .small { font-size: 12px; }
    .warn { color: var(--red); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .actions a { font-size: 14px; }
    .primary { background: var(--gold); color: #1A1406; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
    .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 14px; color: var(--dim); }
    h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 22px 0 8px; font-weight: 500; }
    .rows { display: grid; gap: 6px; }
    .row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
    .row.on { border-color: var(--gold); }
    .row .next { min-width: 120px; text-align: right; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    .stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .stats b { display: block; font-family: var(--mono); font-size: 22px; color: var(--cream); font-weight: 500; }
    .stats span { font-size: 12px; color: var(--dim); }
    .card .stats div { background: var(--bg); }
    #lock { max-width: 520px; margin: 12vh auto 0; text-align: center; }
    #lock p { color: var(--dim); line-height: 1.5; }
    #lock form { display: flex; gap: 8px; margin-top: 18px; }
    #lock input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; color: var(--cream); font-family: var(--mono); font-size: 14px; }
    #key-error { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
    body[data-state="locked"] #live, body[data-state="live"] #lock { display: none; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 16px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    @media (max-width: 640px) {
      h1 { font-size: 24px; }
      #summary { margin-left: 0; width: 100%; }
      .row { grid-template-columns: auto 1fr; }
      .row .muted { grid-column: 2; }
      .row .next { text-align: left; min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .stage svg * { animation: none !important; } }
  </style>
</head>
<body data-state="locked">
  <div class="wrap">
    <header>
      <span class="kicker">Western Conference Elitists</span>
      <h1>Control Room</h1>
      <span id="summary"></span>
    </header>

    <section id="lock">
      <p>The Control Room is private. Paste its key once and this browser will remember it.</p>
      <form id="key-form" autocomplete="off">
        <input id="key-input" type="password" placeholder="wcs_…" aria-label="Control Room key" spellcheck="false">
        <button class="primary" type="submit">Open</button>
      </form>
      <div id="key-error"></div>
    </section>

    <section id="live">
      <nav>
        <button data-tab="map" aria-selected="true">Map</button>
        <button data-tab="list">List</button>
        <button data-tab="timeline">Timeline</button>
        <span class="spacer"></span>
        <button class="ghost" id="notify" title="Alert this browser when a job fails">Browser alerts</button>
        <button class="ghost" id="forget" title="Forget the key on this device">Lock</button>
      </nav>
      <div id="problem" hidden></div>
      <div id="stage" class="stage"></div>
      <div id="chips"></div>
      <div id="card" hidden></div>
    </section>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="/control/page.js"></script>
</body>
</html>
